# Tema do NutriAssist (cores da identidade visual; ajuste os códigos à vontade)
[theme]
base = "light"
primaryColor = "#7E9471"            # verde-sálvia: botões e destaques
backgroundColor = "#F5EFE6"         # creme: fundo da página
secondaryBackgroundColor = "#EAE0D2" # bege: barra lateral e caixas
textColor = "#3B2A20"               # marrom escuro: textos

[browser]
gatherUsageStats = false
